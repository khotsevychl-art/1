<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР1 – Кабінет студента</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Навчальні нотатки</h1>
        </header>

        <main>
            <section id="filters-section">
                <h2>Пошук та фільтрація</h2>
                <div class="toolbar">
                    <input type="text" id="searchInput" placeholder="Пошук за назвою...">
                    <select id="courseFilter">
                        <option value="">Усі дисципліни</option>
                        <option value="Вища математика">Вища математика</option>
                        <option value="ІТК">ІТК</option>
                        <option value="Кібербезпека та захист інформації">Кібербезпека та захист інформації</option>
                    </select>
                </div>
            </section>

            <section id="form-section">
                <h2 id="formTitle">Додати нотатку</h2>
                <form id="noteForm">
                    <div class="field">
                        <label for="courseSelect">Дисципліна</label>
                        <select id="courseSelect" required>
                            <option value="">Оберіть курс...</option>
                            <option value="Вища математика">Вища математика</option>
                            <option value="ІТК">ІТК</option>
                            <option value="Кібербезпека та захист інформації">Кібербезпека та захист інформації</option>
                        </select>
                        <p class="error-text" id="courseError"></p>
                    </div>

                    <div class="field">
                        <label for="titleInput">Заголовок нотатки</label>
                        <input type="text" id="titleInput" placeholder="Напр., Підготовка до екзамену">
                        <p class="error-text" id="titleError"></p>
                    </div>

                    <div class="field">
                        <label for="noteText">Зміст нотатки</label>
                        <textarea id="noteText" rows="4" placeholder="Напишіть тут щось важливе..."></textarea>
                        <p class="error-text" id="noteError"></p>
                    </div>

                    <div class="buttons">
                        <button type="submit" id="submitBtn">Додати</button>
                        <button type="button" id="resetBtn">Очистити</button>
                    </div>
                </form>
            </section>

            <section id="list-section">
                <h2>Список записів</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 20%;">Курс</th>
                                <th style="width: 20%;">Назва</th>
                                <th style="width: 25%;">Зміст</th>
                                <th style="width: 15%;">Дата</th>
                                <th style="width: 20%;">Дії</th>
                            </tr>
                        </thead>
                        <tbody id="notesTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
